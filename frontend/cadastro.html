<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Rolezando AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0d1425 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-container {
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(157, 78, 221, 0.15);
            border-radius: 20px;
            padding: 50px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            font-family: 'Poppins', sans-serif;
            color: #FF006E;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .logo p {
            color: #b0b0b0;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #fff;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(157, 78, 221, 0.2);
            border-radius: 10px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: #666;
        }

        .form-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(157, 78, 221, 0.4);
            box-shadow: 0 0 0 3px rgba(157, 78, 221, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .password-strength {
            display: none;
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(157, 78, 221, 0.1);
            border-radius: 6px;
            font-size: 12px;
            color: #9D4EDD;
        }

        .terms {
            font-size: 12px;
            color: #b0b0b0;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .terms input {
            margin-right: 8px;
            cursor: pointer;
            accent-color: #FF006E;
        }

        .terms a {
            color: #FF006E;
            text-decoration: none;
        }

        .signup-btn {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #FF006E 0%, #06FFA5 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(255, 0, 110, 0.2);
        }

        .signup-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 0, 110, 0.35);
        }

        .signup-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #555;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(157, 78, 221, 0.1);
        }

        .divider span {
            padding: 0 12px;
        }

        .social-signup {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(157, 78, 221, 0.2);
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .social-btn:hover {
            background: rgba(157, 78, 221, 0.1);
            border-color: rgba(157, 78, 221, 0.4);
        }

        .login-link {
            text-align: center;
            color: #b0b0b0;
            font-size: 13px;
        }

        .login-link a {
            color: #FF006E;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #06FFA5;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .signup-container {
                padding: 40px 30px;
                max-width: 100%;
            }

            .logo h1 {
                font-size: 28px;
            }

            .form-row {
                grid-template-columns: 1fr 1fr;
            }

            body {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 30px 20px;
                max-width: 100%;
            }

            .logo h1 {
                font-size: 24px;
            }

            .logo p {
                font-size: 12px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .form-group label {
                font-size: 13px;
            }

            .form-group input {
                padding: 10px 12px;
                font-size: 14px;
            }

            .signup-btn {
                padding: 12px 16px;
                font-size: 14px;
            }

            .social-btn {
                padding: 10px;
                font-size: 12px;
            }

            .login-link {
                font-size: 12px;
            }

            body {
                padding: 10px;
            }
        }

        @media (max-width: 360px) {
            .signup-container {
                padding: 20px 15px;
            }

            .logo h1 {
                font-size: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="logo">
            <h1>🎬 Rolezando</h1>
            <p>Comece a criar seus vídeos hoje</p>
        </div>

        <form id="signupForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">Primeiro Nome</label>
                    <input 
                        type="text" 
                        id="firstName" 
                        placeholder="João" 
                        required
                    >
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="lastName">Sobrenome</label>
                    <input 
                        type="text" 
                        id="lastName" 
                        placeholder="Silva" 
                        required
                    >
                    <div class="error-message"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="seu@email.com" 
                    required
                >
                <div class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="••••••••" 
                    required
                >
                <div class="password-strength">
                    Força: <span id="strengthText">Fraca</span>
                </div>
                <div class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Senha</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    placeholder="••••••••" 
                    required
                >
                <div class="error-message"></div>
            </div>

            <div class="terms">
                <label>
                    <input type="checkbox" id="terms" required>
                    Concordo com os <a href="#">Termos de Serviço</a> e 
                    <a href="#">Política de Privacidade</a>
                </label>
            </div>

            <button type="submit" class="signup-btn">Criar Conta</button>
        </form>

        <div class="divider">
            <span>OU</span>
        </div>

        <div class="social-signup">
            <button type="button" class="social-btn" onclick="alert('Google Sign-Up em breve')">🔵 Google</button>
            <button type="button" class="social-btn" onclick="alert('GitHub Sign-Up em breve')">🔗 GitHub</button>
        </div>

        <div class="login-link">
            Já tem conta? <a href="login.html">Entre aqui</a>
        </div>
    </div>

    <script>
        // Validação de força da senha
        const passwordInput = document.getElementById('password');
        const strengthText = document.getElementById('strengthText');
        const passwordStrength = document.querySelector('.password-strength');

        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            let strength = 'Fraca';
            let color = '#ff6b6b';

            if (password.length >= 8) {
                if (/[A-Z]/.test(password) && /[0-9]/.test(password) && /[!@#$%^&*]/.test(password)) {
                    strength = 'Forte';
                    color = '#51cf66';
                } else if (/[A-Z]/.test(password) || /[0-9]/.test(password)) {
                    strength = 'Média';
                    color = '#ffd700';
                }
            }

            strengthText.textContent = strength;
            strengthText.style.color = color;
            
            if (password.length > 0) {
                passwordStrength.classList.add('show');
            } else {
                passwordStrength.classList.remove('show');
            }
        });

        // Submissão do formulário
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const termsAccepted = document.getElementById('terms').checked;

            // Validações
            if (password !== confirmPassword) {
                document.querySelector('#confirmPassword + .error-message').textContent = 'As senhas não correspondem';
                document.querySelector('#confirmPassword + .error-message').classList.add('show');
                return;
            }

            if (!termsAccepted) {
                alert('❌ Você deve aceitar os Termos de Serviço');
                return;
            }

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        firstName, 
                        lastName, 
                        email, 
                        password,
                        terms: termsAccepted
                    })
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = 'conta.html';
                } else {
                    alert('❌ ' + (data.message || 'Erro ao criar conta'));
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('❌ Erro ao criar conta. Tente novamente.');
            }
        });
    </script>
</body>
</html>
