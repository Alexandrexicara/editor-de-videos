name: Studio Criativo AI CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'studio-criativo/**'
      - 'backend/studioCriativo.js'
      - 'backend/server.js'
  push:
    branches: [feature/studio-criativo-integrado]
jobs:
  build-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Studio dependencies
        working-directory: studio-criativo
        run: npm install --no-audit --no-fund
      - name: Production build
        working-directory: studio-criativo
        run: npm run build
      - name: TypeScript validation
        working-directory: studio-criativo
        run: npm run typecheck
      - name: Check backend JavaScript
        run: node --check backend/server.js && node --check backend/studioCriativo.js
